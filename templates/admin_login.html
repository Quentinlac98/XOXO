<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chuck Mode — Accès Restreint</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-light: #E2C97E;
      --gold-dim: rgba(201,168,76,.12);
      --black: #040404;
      --dark: #090909;
      --cream: #F5F0E8;
      --stone: #7A7060;
      --red: #C0504D;
    }

    html, body {
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      background: var(--black);
      color: var(--cream);
      overflow: hidden;
    }

    /* ══════════════════════════════════
       BACKGROUND — ARCHITECTURE
    ══════════════════════════════════ */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* Grille art-déco subtile */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    }

    /* Halo central doré */
    .bg-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(ellipse at center,
        rgba(201,168,76,.07) 0%,
        rgba(201,168,76,.03) 30%,
        transparent 70%
      );
      border-radius: 50%;
      pointer-events: none;
    }

    /* Lignes décoratives diagonales */
    .bg-lines {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: .35;
    }
    .bg-lines::before, .bg-lines::after {
      content: '';
      position: absolute;
      width: 1px;
      height: 100%;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(201,168,76,.3) 30%,
        rgba(201,168,76,.3) 70%,
        transparent 100%
      );
    }
    .bg-lines::before { left: calc(50% - 220px); }
    .bg-lines::after  { left: calc(50% + 220px); }

    /* Coin décoratif bas gauche */
    .bg-corner {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 300px;
      height: 300px;
      background: radial-gradient(ellipse at bottom left,
        rgba(201,168,76,.06) 0%,
        transparent 60%
      );
    }
    .bg-corner-r {
      position: absolute;
      top: 0;
      right: 0;
      width: 300px;
      height: 300px;
      background: radial-gradient(ellipse at top right,
        rgba(201,168,76,.06) 0%,
        transparent 60%
      );
    }

    /* ══════════════════════════════════
       CARD PRINCIPALE
    ══════════════════════════════════ */
    .stage {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      animation: cardReveal .7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════════
       HEADER
    ══════════════════════════════════ */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header-eyebrow {
      font-size: 8px;
      letter-spacing: .55em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
      opacity: 0;
      animation: fadeUp .5s .15s ease forwards;
    }

    .header-monogram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,.25);
      background: rgba(201,168,76,.05);
      margin: 0 auto 18px;
      position: relative;
      opacity: 0;
      animation: fadeUp .5s .25s ease forwards;
    }
    .header-monogram::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,.1);
    }
    .header-monogram-letter {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 800;
      color: white;
      letter-spacing: .04em;
      line-height: 1.05;
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeUp .5s .35s ease forwards;
    }

    .header-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-style: italic;
      font-weight: 300;
      color: var(--stone);
      line-height: 1.5;
      opacity: 0;
      animation: fadeUp .5s .45s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════════
       DIVIDER
    ══════════════════════════════════ */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp .5s .5s ease forwards;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,168,76,.25));
    }
    .divider-line:last-child {
      background: linear-gradient(to left, transparent, rgba(201,168,76,.25));
    }
    .divider-diamond {
      width: 5px;
      height: 5px;
      border: 1px solid rgba(201,168,76,.5);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* ══════════════════════════════════
       FORM
    ══════════════════════════════════ */
    .form-wrap {
      opacity: 0;
      animation: fadeUp .5s .55s ease forwards;
    }

    .form-label {
      font-size: 8px;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 8px;
      display: block;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--stone);
      pointer-events: none;
      transition: color .25s;
    }

    .pwd-input {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(201,168,76,.18);
      border-radius: 14px;
      padding: 15px 48px 15px 44px;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      letter-spacing: .12em;
      outline: none;
      transition: border-color .25s, background .25s, box-shadow .25s;
    }
    .pwd-input::placeholder {
      color: var(--stone);
      letter-spacing: .05em;
      font-size: 13px;
    }
    .pwd-input:focus {
      border-color: rgba(201,168,76,.5);
      background: rgba(255,255,255,.06);
      box-shadow: 0 0 0 3px rgba(201,168,76,.07), 0 8px 24px rgba(0,0,0,.3);
    }
    .input-wrap:focus-within .input-icon {
      color: var(--gold);
    }

    .toggle-pwd {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--stone);
      font-size: 14px;
      padding: 4px;
      transition: color .2s;
    }
    .toggle-pwd:hover { color: var(--gold); }

    /* Error */
    .error-box {
      background: rgba(192,80,77,.1);
      border: 1px solid rgba(192,80,77,.3);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      color: #e87c7a;
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      animation: shake .4s ease;
    }
    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      20%    { transform: translateX(-6px); }
      40%    { transform: translateX(6px); }
      60%    { transform: translateX(-4px); }
      80%    { transform: translateX(4px); }
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      background: var(--gold);
      color: var(--black);
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 6px 20px rgba(201,168,76,.2);
      position: relative;
      overflow: hidden;
    }
    .submit-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .2s;
    }
    .submit-btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(201,168,76,.3);
    }
    .submit-btn:hover::after { opacity: 1; }
    .submit-btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 14px rgba(201,168,76,.2);
    }

    /* Loading state */
    .submit-btn.loading {
      pointer-events: none;
      opacity: .75;
    }
    .submit-btn.loading .btn-text { opacity: 0; }
    .submit-btn.loading .btn-spinner { display: block; }
    .btn-spinner {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: var(--black);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

    /* ══════════════════════════════════
       FOOTER
    ══════════════════════════════════ */
    .footer {
      text-align: center;
      margin-top: 32px;
      opacity: 0;
      animation: fadeUp .5s .7s ease forwards;
    }
    .footer-xoxo {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      color: var(--stone);
      letter-spacing: .08em;
    }
    .footer-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
    }
    .footer-dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(201,168,76,.25);
    }
    .footer-dot.mid { background: rgba(201,168,76,.5); width: 4px; height: 4px; }

    /* ══════════════════════════════════
       COIN ORNEMENTS
    ══════════════════════════════════ */
    .ornament {
      position: fixed;
      z-index: 5;
      pointer-events: none;
      opacity: .5;
    }
    .ornament-tl { top: 24px; left: 24px; }
    .ornament-tr { top: 24px; right: 24px; transform: scaleX(-1); }
    .ornament-bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
    .ornament-br { bottom: 24px; right: 24px; transform: scale(-1); }

    .orn-svg { width: 48px; height: 48px; color: rgba(201,168,76,.35); }

    /* ══════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════ */
    @media (max-width: 480px) {
      .header-title { font-size: 34px; }
      .bg-lines::before, .bg-lines::after { display: none; }
      .ornament { display: none; }
    }
  </style>
</head>
<body>

  <!-- ══ BACKGROUND ══ -->
  <div class="bg">
    <div class="bg-grid"></div>
    <div class="bg-halo"></div>
    <div class="bg-lines"></div>
    <div class="bg-corner"></div>
    <div class="bg-corner-r"></div>
  </div>

  <!-- ══ ORNEMENTS COINS ══ -->
  <div class="ornament ornament-tl">
    <svg class="orn-svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width=".8">
      <path d="M2 2 L24 2 L24 8"/>
      <path d="M2 2 L2 24 L8 24"/>
      <path d="M16 2 L16 16 L2 16"/>
    </svg>
  </div>
  <div class="ornament ornament-tr">
    <svg class="orn-svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width=".8">
      <path d="M2 2 L24 2 L24 8"/>
      <path d="M2 2 L2 24 L8 24"/>
      <path d="M16 2 L16 16 L2 16"/>
    </svg>
  </div>
  <div class="ornament ornament-bl">
    <svg class="orn-svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width=".8">
      <path d="M2 2 L24 2 L24 8"/>
      <path d="M2 2 L2 24 L8 24"/>
      <path d="M16 2 L16 16 L2 16"/>
    </svg>
  </div>
  <div class="ornament ornament-br">
    <svg class="orn-svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width=".8">
      <path d="M2 2 L24 2 L24 8"/>
      <path d="M2 2 L2 24 L8 24"/>
      <path d="M16 2 L16 16 L2 16"/>
    </svg>
  </div>

  <!-- ══ STAGE ══ -->
  <div class="stage">
    <div class="card">

      <!-- Header -->
      <div class="header">
        <div class="header-eyebrow">Accès Restreint · Bass Industries</div>
        <div class="header-monogram">
          <span class="header-monogram-letter">C</span>
        </div>
        <h1 class="header-title">Chuck Mode</h1>
        <p class="header-subtitle">
          Only Bass Industries executives<br>beyond this point.
        </p>
      </div>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-diamond"></div>
        <div class="divider-line"></div>
      </div>

      <!-- Form -->
      <div class="form-wrap">

        {% if error %}
        <div class="error-box">
          <span>✕</span>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" id="login-form" onsubmit="handleSubmit(event)">

          <label class="form-label" for="pwd-field">Mot de passe</label>

          <div class="input-wrap">
            <span class="input-icon">🔐</span>
            <input
              id="pwd-field"
              type="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              autofocus
              class="pwd-input"
            />
            <button type="button" class="toggle-pwd" onclick="togglePwd()" title="Afficher/masquer">
              <span id="pwd-eye">👁</span>
            </button>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">
            <span class="btn-text">Entrer dans le Empire ✦</span>
            <span class="btn-spinner"></span>
          </button>

        </form>
      </div>

      <!-- Footer -->
      <div class="footer">
        <div class="footer-xoxo">XOXO, Gossip Girl</div>
        <div class="footer-dots">
          <div class="footer-dot"></div>
          <div class="footer-dot mid"></div>
          <div class="footer-dot"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* ── Toggle password visibility ── */
    function togglePwd() {
      const field = document.getElementById('pwd-field');
      const eye   = document.getElementById('pwd-eye');
      if (field.type === 'password') {
        field.type = 'text';
        eye.textContent = '🙈';
      } else {
        field.type = 'password';
        eye.textContent = '👁';
      }
    }

    /* ── Submit with loading state ── */
    function handleSubmit(e) {
      const btn = document.getElementById('submit-btn');
      const pwd = document.getElementById('pwd-field').value;
      if (!pwd.trim()) {
        e.preventDefault();
        document.getElementById('pwd-field').focus();
        shakePwd();
        return;
      }
      btn.classList.add('loading');
      // On laisse le form se soumettre normalement (méthode POST Flask)
    }

    function shakePwd() {
      const el = document.getElementById('pwd-field');
      el.style.animation = 'none';
      el.offsetHeight; // reflow
      el.style.borderColor = 'rgba(192,80,77,.6)';
      setTimeout(() => el.style.borderColor = '', 600);
    }

    /* ── Easter egg : konami code → "I'm Chuck Bass" ── */
    const _kk = [38,38,40,40,37,39,37,39,66,65];
    let _ki = 0;
    document.addEventListener('keydown', e => {
      if (e.keyCode === _kk[_ki]) {
        _ki++;
        if (_ki === _kk.length) {
          _ki = 0;
          document.getElementById('pwd-field').value = '';
          document.getElementById('pwd-field').placeholder = "I'm Chuck Bass.";
        }
      } else {
        _ki = 0;
      }
    });
  </script>

</body>
</html>
